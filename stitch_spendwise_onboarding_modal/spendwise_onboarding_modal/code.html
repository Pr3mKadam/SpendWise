<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SpendWise - Account Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary": "#bcc7de",
                      "on-tertiary-container": "#1f2a3e",
                      "surface-container-lowest": "#090e17",
                      "primary-fixed-dim": "#b1c6ff",
                      "on-primary": "#002c70",
                      "secondary-fixed-dim": "#bcc7de",
                      "on-error-container": "#ffdad6",
                      "tertiary-fixed-dim": "#bcc6e1",
                      "on-surface-variant": "#c2c6d7",
                      "on-secondary-fixed": "#111c2d",
                      "on-tertiary-fixed": "#101b2f",
                      "surface-variant": "#30353f",
                      "on-tertiary": "#263045",
                      "outline-variant": "#424654",
                      "inverse-surface": "#dee2f0",
                      "on-surface": "#dee2f0",
                      "surface-container-highest": "#30353f",
                      "secondary-container": "#3e495d",
                      "on-background": "#dee2f0",
                      "secondary-fixed": "#d8e3fb",
                      "error": "#ffb4ab",
                      "tertiary-container": "#8691aa",
                      "on-primary-container": "#002662",
                      "surface-dim": "#0e131d",
                      "tertiary-fixed": "#d8e2fe",
                      "surface-tint": "#b1c6ff",
                      "on-error": "#690005",
                      "on-secondary-container": "#aeb9d0",
                      "outline": "#8c90a0",
                      "surface-bright": "#343944",
                      "on-secondary": "#263143",
                      "surface-container": "#1b2029",
                      "on-tertiary-fixed-variant": "#3c475d",
                      "on-primary-fixed-variant": "#00419d",
                      "surface": "#0e131d",
                      "primary-fixed": "#d9e2ff",
                      "inverse-on-surface": "#2c303b",
                      "inverse-primary": "#0057cd",
                      "on-secondary-fixed-variant": "#3c475a",
                      "error-container": "#93000a",
                      "surface-container-high": "#252a34",
                      "primary": "#b1c6ff",
                      "background": "#0e131d",
                      "primary-container": "#578cff",
                      "surface-container-low": "#171c25",
                      "tertiary": "#bcc6e1",
                      "on-primary-fixed": "#001946"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Manrope"],
                      "body": ["Inter"],
                      "label": ["Inter"]
              }
            },
          },
        }
      </script>
</head>
<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">
<!-- Background Content (Simulated Home Screen) -->
<main class="fixed inset-0 p-8 grid grid-cols-1 md:grid-cols-3 gap-6 pointer-events-none opacity-20 filter blur-sm">
<div class="col-span-1 md:col-span-2 space-y-8">
<div class="h-64 bg-surface-container rounded-lg"></div>
<div class="grid grid-cols-2 gap-4">
<div class="h-32 bg-surface-container-high rounded-lg"></div>
<div class="h-32 bg-surface-container-high rounded-lg"></div>
</div>
<div class="h-48 bg-surface-container-low rounded-lg"></div>
</div>
<div class="space-y-6">
<div class="h-96 bg-surface-container-highest rounded-lg"></div>
<div class="h-40 bg-surface-container-high rounded-lg"></div>
</div>
</main>
<!-- Onboarding Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-surface-container-lowest/80 backdrop-blur-sm p-4">
<!-- Modal Card -->
<div class="w-full max-w-[480px] bg-[#0f1a2e] rounded-2xl p-8 shadow-[0_20px_40px_rgba(0,0,0,0.5)] border border-outline-variant/10">
<!-- Logo Section -->
<div class="mb-10 text-center md:text-left">
<span class="text-[#3b7eff] font-headline font-bold text-xl tracking-tight">SpendWise</span>
</div>
<!-- Header Section -->
<div class="mb-8 space-y-2">
<h1 class="text-white font-headline font-bold text-2xl tracking-tight">Let's set up your account</h1>
<p class="text-on-surface-variant font-body text-sm">We need one number to get started</p>
</div>
<!-- Main Input Form -->
<div class="space-y-6">
<!-- Label and Currency Row -->
<div class="flex flex-col gap-4">
<div class="flex justify-between items-end">
<label class="text-on-surface-variant font-label text-xs uppercase tracking-wider font-semibold">Your current balance</label>
<!-- Currency Selector -->
<div class="flex gap-2">
<button class="w-8 h-8 flex items-center justify-center rounded-full bg-[#3b7eff] text-white text-sm font-bold transition-all hover:scale-105 active:scale-95 shadow-lg shadow-[#3b7eff]/20">
                                $
                            </button>
<button class="w-8 h-8 flex items-center justify-center rounded-full border border-outline-variant/40 text-on-surface-variant text-sm font-medium hover:border-[#3b7eff]/50 transition-colors">
                                £
                            </button>
<button class="w-8 h-8 flex items-center justify-center rounded-full border border-outline-variant/40 text-on-surface-variant text-sm font-medium hover:border-[#3b7eff]/50 transition-colors">
                                €
                            </button>
<button class="w-8 h-8 flex items-center justify-center rounded-full border border-outline-variant/40 text-on-surface-variant text-sm font-medium hover:border-[#3b7eff]/50 transition-colors">
                                ₹
                            </button>
</div>
</div>
<!-- Large Input Field -->
<div class="relative group">
<input class="w-full h-20 bg-[#1e293b] border-2 border-transparent focus:border-[#3b7eff] focus:ring-0 rounded-2xl px-6 text-3xl font-headline font-bold text-white placeholder-white/20 transition-all duration-300 outline-none" placeholder="5,200.00" type="text"/>
<div class="absolute inset-0 rounded-2xl pointer-events-none group-focus-within:shadow-[0_0_20px_rgba(59,126,255,0.15)]"></div>
</div>
</div>
<!-- Call to Action -->
<div class="pt-4 space-y-6">
<button class="w-full h-14 bg-gradient-to-r from-[#3b7eff] to-[#578cff] hover:to-[#3b7eff] text-white font-headline font-bold text-lg rounded-xl flex items-center justify-center gap-2 group transition-all duration-300 hover:shadow-[0_12px_24px_rgba(59,126,255,0.3)] active:scale-[0.98]">
                        Get started
                        <span class="material-symbols-outlined transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Fine Print -->
<div class="flex items-center justify-center gap-2 text-on-surface-variant/60 font-body text-[11px]">
<span class="material-symbols-outlined text-[14px]" data-icon="lock">lock</span>
<span>Your data never leaves this device</span>
</div>
</div>
</div>
</div>
</div>
<!-- Hidden Navigation (Suppressed per "The Destination Rule" for onboarding) -->
<!-- Navigation shell is suppressed for focused onboarding journey -->
</body></html>
